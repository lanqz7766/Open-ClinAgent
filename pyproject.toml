[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinagent"
version = "0.2.1"
description = "Clinical AI agent platform for radiology reporting and radiation therapy planning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Qizhen Lan" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1.0",
    "numpy>=1.26.0",
    "nibabel>=5.2.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.1.0"]
anthropic = ["anthropic>=0.40.0"]
accurate-tokens = ["tiktoken>=0.5.0"]
mcp = ["fastmcp>=2.3.0"]
all = ["google-genai>=0.1.0", "anthropic>=0.40.0", "tiktoken>=0.5.0"]
pdf = ["weasyprint>=60.0"]
preview = ["SimpleITK>=2.3.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27.0",
    "tiktoken>=0.5.0",
    "google-genai>=0.1.0",
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/lanqz7766/Open-ClinAgent"
Repository = "https://github.com/lanqz7766/Open-ClinAgent"
Issues = "https://github.com/lanqz7766/Open-ClinAgent/issues"

[project.scripts]
clinagent = "clinagent.__main__:main"
clinagent-auth = "clinagent.gateway.auth_admin:main"
clinagent-brain-tumor-service = "clinagent.gateway.brain_tumor_service:main"
clinagent-brain-tumor-worker = "clinagent.gateway.brain_tumor_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinagent"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "src/clinagent/_bundled/configs"
"examples/report_quality_samples" = "src/clinagent/_bundled/examples/report_quality_samples"
"skills" = "src/clinagent/_bundled/skills"
"scenarios" = "src/clinagent/_bundled/scenarios"
"workflows" = "src/clinagent/_bundled/workflows"

[tool.hatch.build.targets.sdist]
include = [
    "/src/clinagent",
    "/configs",
    "/examples/report_quality_samples",
    "/skills",
    "/scenarios",
    "/workflows",
    "/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["benchmark: performance benchmark tests (deselect with -m 'not benchmark')"]
