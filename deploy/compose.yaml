x-runtime: &runtime
  image: ${CLINAGENT_IMAGE:?Set an immutable release image tag}
  user: ${CLINAGENT_RUN_UID:-10001}:${CLINAGENT_RUN_GID:-10001}
  env_file:
    - ${CLINAGENT_RUNTIME_ENV_FILE:?Set the private runtime env file}
  environment:
    CLINAGENT_HOST: 0.0.0.0
    CLINAGENT_GATEWAY_HOST: 0.0.0.0
    CLINAGENT_REQUIRE_USER_AUTH: "1"
    CLINAGENT_ALLOW_SELF_REGISTRATION: "0"
    CLINAGENT_AUTH_ALLOW_LOCAL_PASSWORD_RESET: "0"
    CLINAGENT_AUTH_COOKIE_SECURE: ${CLINAGENT_COOKIE_SECURE:-true}
    CLINAGENT_AUTH_COOKIE_NAME: ${CLINAGENT_COOKIE_NAME:-clinagent_preview}
    CLINAGENT_PUBLIC_URL: ${CLINAGENT_PUBLIC_URL:?Set the permanent sign-in origin}
    CLINAGENT_CORS_ORIGINS: ${CLINAGENT_PUBLIC_URL:?Set the permanent sign-in origin}
    CLINAGENT_PREVIEW_SCOPE: ${CLINAGENT_PREVIEW_SCOPE:-brain_tumor}
    CLINAGENT_PHYSICIAN_CURATED_ONLY: "1"
    CLINAGENT_BRAIN_TUMOR_DURABLE_QUEUE: "1"
    CLINAGENT_AUTH_DB: /var/lib/clinagent/auth.sqlite3
    CLINAGENT_DATABASE_PATH: /var/lib/clinagent/state.sqlite3
    CLINAGENT_ARTIFACT_DIR: /var/lib/clinagent/artifacts
    CLINAGENT_LOCAL_UPLOAD_DIR: /var/lib/clinagent/uploads
    CLINAGENT_BRAIN_TUMOR_ASSET_ROOT: /var/lib/clinagent/brain_tumor
    CLINAGENT_BRAIN_TUMOR_UPLOAD_ROOT: /var/lib/clinagent/uploads/brain_tumor
    CLINAGENT_UPLOAD_RETENTION_DAYS: "30"
  volumes:
    - type: bind
      source: ${CLINAGENT_STATE_DIR:?Set a dedicated writable state directory}
      target: /var/lib/clinagent
    - type: bind
      source: ${CLINAGENT_CURATED_DATA_DIR:?Set the deidentified curated data directory}
      target: /data/curated
      read_only: true
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  gateway:
    <<: *runtime
    ports:
      - "${CLINAGENT_BIND_ADDRESS:-127.0.0.1}:${CLINAGENT_HTTP_PORT:-8000}:8000"
  worker:
    <<: *runtime
    command: [python, -m, clinagent.gateway.brain_tumor_worker]
    healthcheck:
      disable: true
    stop_grace_period: 120s
    depends_on:
      gateway:
        condition: service_healthy
  backup:
    <<: *runtime
    command: [python, -m, clinagent.gateway.backup_state, --interval-hours, "24"]
    healthcheck:
      disable: true
    depends_on:
      gateway:
        condition: service_healthy
